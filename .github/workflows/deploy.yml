name: Deploy on fly.io

on:
  push:
    branches: [ trunk ]

jobs:
  deploy_app:
    runs-on: ubuntu-latest

    permissions:
      deployments: write
      contents: read

    # Only run one deployment at a time per commit.
    concurrency:
      group: tryzjit

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        id: deploy
        uses: superfly/fly-pr-review-apps@1.2.1
        with:
          name: tryzjit
          region: ewr
          org: personal
        env:
          DOCKER_BUILDKIT: 1
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
