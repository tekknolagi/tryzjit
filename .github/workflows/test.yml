name: Integration Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tryzjit:test --target build .

      - name: Run integration tests
        run: docker run --rm -v $(pwd):/app -w /app tryzjit:test ruby test/test_integration.rb
