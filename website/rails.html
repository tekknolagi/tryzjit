<!doctype html>
<html>
<head>
    <script src="vendor/split.min.js"></script>
    <script src="vendor/underscore.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <link rel="stylesheet" href="vendor/iongraph.css">
    <link rel="stylesheet" href="vendor/highlight.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="vendor/iongraph.js"></script>
    <script type="module" src="main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
</head>
<body data-rails="true" data-storage-key="iongraph-saved-rails-code">
    <div class="container">
        <div class="left-panel" id="left-panel">
            <div class="share-block">
                <label>Rails is booted before your code runs (in-memory SQLite); ZJIT is enabled after boot.</label>
            </div>
            <div class="share-block">
                <label for="share-url">Share URL:</label>
                <input type="text" id="share-url" readonly placeholder="Hit compile to save">
            </div>
            <div class="call-threshold-block">
                <label for="call-threshold">Call threshold:</label>
                <input type="number" id="call-threshold" min="2" max="100" value="30" />
            </div>
            <div id="editor"><div id="editor-yace"></div></div>
            <button id="execute-btn">Compile</button>
        </div>
        <div class="gutter" id="gutter"></div>
        <div class="right-panel">
          <div id="ui-error"></div>
        </div>
    </div>

    <script type="text/x-ruby" id="default-code">
ActiveRecord::Schema.define do
  create_table :posts do |t|
    t.string :title
  end
end

class Post < ActiveRecord::Base
end

Post.create!(title: "Hello ZJIT")

def title_lengths
  Post.all.map { |post| post.title.length }
end

30.times do
  title_lengths
end
</script>

    <script>
      const rightPanel = document.querySelector('.right-panel');
      const ui = new iongraph.StandaloneUI();
      rightPanel.appendChild(ui.root);
      ui.root.id = 'iongraph-root';
    </script>
</body>
</html>
